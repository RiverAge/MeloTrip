name: Release Multi Platform

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-multi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0-0.2.pre"
          channel: beta
          cache: true
          cache-key: flutter-${{ runner.os }}-3.41.0-0.2.pre

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          cache-write-only: false
          gradle-home-cache-includes: |
            caches
            notifications
            wrapper

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Android signing files
        run: |
          mkdir -p android/app/keystore
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | tr -d '\r\n' | base64 -d > android/app/keystore/melotrip-release.jks
          cat > android/key.properties <<EOF
          storeFile=keystore/melotrip-release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APKs
        shell: bash
        run: |
          set -euo pipefail
          # split-per-abi：产出 arm64-v8a / armeabi-v7a / x86_64 三个小包，
          # 文件名 app-<abi>-release.apk。每个包体积小（约 25M），大陆走 proxy
          # 下载快；客户端按本机 ABI 选对应包。
          # 再单独构一次 universal（app-release.apk）作兜底，给查不到 ABI 的
          # 设备 / 模拟器。versionCode 由各包 aapt 实读，写到 metadata 对应行，
          # 客户端按"当前装包的 versionCode"比对，彻底解决 split 包 versionCode
          # 错位（旧 bug：update.json 只记一个 versionCode，与 split 包的偏移
          # versionCode 对不上，导致"已是最新"收不到更新）。
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Generate Android metadata fragment
        shell: bash
        run: |
          set -euo pipefail

          app_version="$(awk '/^version:/{print $2; exit}' pubspec.yaml | tr -d '\r')"
          version_core="${app_version%%+*}"
          build_number="0"
          if [[ "$app_version" == *"+"* ]]; then
            build_number="${app_version#*+}"
          fi
          aapt_path="$(find "${ANDROID_HOME}/build-tools" -name aapt -type f | sort -V | tail -n 1)"

          emit_apk_meta() {
            local apk_path="$1"
            local abi="$2"
            local suffix="$3"   # 用于 metadata key，如 ".arm64-v8a" 或 ""(universal)
            if [[ ! -f "$apk_path" ]]; then
              echo "WARN: $apk_path not found, skipping" >&2
              return
            fi
            local version_code="$("${aapt_path}" dump badging "$apk_path" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -n1)"
            if [[ -z "$version_code" ]]; then
              version_code="${build_number}"
            fi
            local sha256="$(sha256sum "$apk_path" | awk '{print $1}')"
            local size="$(stat -c%s "$apk_path")"
            local asset_name="$(basename "$apk_path")"
            # 顶层 versionCode/assetName/size/sha256 用 universal（兜底）；
            # 每个 ABI 再单独记一组带 .<abi> 后缀的行。
            if [[ -z "$suffix" ]]; then
              cat >> android-metadata.txt <<EOF
          versionCode=${version_code}
          asset.android.apk=${asset_name}
          sha256.android.apk=${sha256}
          size.android.apk=${size}
          EOF
            else
              cat >> android-metadata.txt <<EOF
          asset.android.apk${suffix}=${asset_name}
          versionCode.android.apk${suffix}=${version_code}
          sha256.android.apk${suffix}=${sha256}
          size.android.apk${suffix}=${size}
          EOF
            fi
          }

          cat > android-metadata.txt <<EOF
          versionName=${version_core}
          EOF
          emit_apk_meta "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "arm64-v8a" ".arm64-v8a"
          emit_apk_meta "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk" "armeabi-v7a" ".armeabi-v7a"
          emit_apk_meta "build/app/outputs/flutter-apk/app-x86_64-release.apk" "x86_64" ".x86_64"
          emit_apk_meta "build/app/outputs/flutter-apk/app-release.apk" "" ""

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-artifacts
          path: |
            build/app/outputs/flutter-apk/*.apk
            android-metadata.txt

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0-0.2.pre"
          channel: beta
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows release
        run: flutter build windows --release

      - name: Pack Windows bundle
        shell: pwsh
        run: |
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "melotrip-windows-x64.zip"

      - name: Generate Windows metadata fragment
        shell: bash
        run: |
          set -euo pipefail
          sha256="$(sha256sum melotrip-windows-x64.zip | awk '{print $1}')"
          size="$(stat -c%s melotrip-windows-x64.zip)"

          cat > windows-metadata.txt <<EOF
          asset.windows.zip=melotrip-windows-x64.zip
          sha256.windows.zip=${sha256}
          size.windows.zip=${size}
          EOF

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            melotrip-windows-x64.zip
            windows-metadata.txt

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            cmake \
            ninja-build \
            pkg-config \
            libgtk-3-dev \
            liblzma-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0-0.2.pre"
          channel: beta
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux release
        run: flutter build linux --release

      - name: Pack Linux bundle
        shell: bash
        run: |
          tar -C build/linux/x64/release -czf melotrip-linux-x64.tar.gz bundle

      - name: Generate Linux metadata fragment
        shell: bash
        run: |
          set -euo pipefail
          sha256="$(sha256sum melotrip-linux-x64.tar.gz | awk '{print $1}')"
          size="$(stat -c%s melotrip-linux-x64.tar.gz)"

          cat > linux-metadata.txt <<EOF
          asset.linux.tar.gz=melotrip-linux-x64.tar.gz
          sha256.linux.tar.gz=${sha256}
          size.linux.tar.gz=${size}
          EOF

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            melotrip-linux-x64.tar.gz
            linux-metadata.txt

  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.0-0.2.pre"
          channel: beta
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS release
        run: flutter build macos --release

      - name: Pack macOS app bundle
        shell: bash
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../melotrip-macos.zip MeloTrip.app

      - name: Generate macOS metadata fragment
        shell: bash
        run: |
          set -euo pipefail
          sha256="$(shasum -a 256 melotrip-macos.zip | awk '{print $1}')"
          size="$(stat -f%z melotrip-macos.zip)"

          cat > macos-metadata.txt <<EOF
          asset.macos.zip=melotrip-macos.zip
          sha256.macos.zip=${sha256}
          size.macos.zip=${size}
          EOF

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            melotrip-macos.zip
            macos-metadata.txt

  publish-release:
    needs:
      - build-android
      - build-windows
      - build-linux
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect files
        shell: bash
        run: |
          mkdir -p release-files
          find dist -type f -name "*.apk" -exec cp {} release-files/ \;
          find dist -type f -name "*.zip" -exec cp {} release-files/ \;
          find dist -type f -name "*.tar.gz" -exec cp {} release-files/ \;

      - name: Generate release body with metadata
        shell: bash
        run: |
          set -euo pipefail

          # Collect metadata fragments
          android_meta="$(cat dist/android-artifacts/android-metadata.txt 2>/dev/null || true)"
          windows_meta="$(cat dist/windows-artifacts/windows-metadata.txt 2>/dev/null || true)"
          linux_meta="$(cat dist/linux-artifacts/linux-metadata.txt 2>/dev/null || true)"
          macos_meta="$(cat dist/macos-artifacts/macos-metadata.txt 2>/dev/null || true)"

          # Extract version info from Android metadata (authoritative source)
          versionName="$(echo "$android_meta" | grep '^versionName=' | cut -d= -f2)"
          versionCode="$(echo "$android_meta" | grep '^versionCode=' | cut -d= -f2)"

          # Build the metadata block
          cat > release-body.md <<EOF
          <!-- MELOTRIP_UPDATE_METADATA
          versionName=${versionName}
          versionCode=${versionCode}
          ${android_meta}
          ${windows_meta}
          ${linux_meta}
          ${macos_meta}
          MELOTRIP_UPDATE_METADATA -->

          ## What's Changed

          EOF

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          fragments = [
              Path("dist/android-artifacts/android-metadata.txt"),
              Path("dist/windows-artifacts/windows-metadata.txt"),
              Path("dist/linux-artifacts/linux-metadata.txt"),
              Path("dist/macos-artifacts/macos-metadata.txt"),
          ]
          metadata = {}
          for path in fragments:
              if not path.exists():
                  continue
              for raw_line in path.read_text(encoding="utf-8").splitlines():
                  line = raw_line.strip()
                  if not line or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  metadata[key] = value

          repository = os.environ["GITHUB_REPOSITORY"]
          tag_name = os.environ["GITHUB_REF_NAME"]
          version_name = metadata["versionName"]
          version_code = int(metadata["versionCode"])
          platforms = {}

          # 大陆加速镜像前缀。GitHub 直链放最后兜底。
          # 这些公益 proxy 会随时下线/被拉黑，客户端逐个尝试 + 兜底，
          # 不影响最终拿到正确包（SHA-256 校验兜底）。
          MIRROR_PREFIXES = (
              "https://gh-proxy.com/",
              "https://ghproxy.net/",
              "https://gh.idayer.com/",
          )

          # split-per-abi 产出的 ABI 后缀（key 形如 apk.arm64-v8a）。
          # 含点且第二段命中此处者，归到 platforms[platform]["abis"][abi]；
          # 否则（纯 apk / zip / tar.gz）归 platform 顶层（universal 兜底）。
          KNOWN_ABIS = {"arm64-v8a", "armeabi-v7a", "x86_64"}

          def split_platform_pkg(platform_key):
              """返回 (platform, package_type, abi_or_None)。"""
              platform, rest = platform_key.split(".", 1)
              if "." in rest:
                  pkg_type, abi = rest.split(".", 1)
                  if abi in KNOWN_ABIS:
                      return platform, pkg_type, abi
              return platform, rest, None

          def build_mirrors(github_url):
              mirrors = [f"{prefix}{github_url}" for prefix in MIRROR_PREFIXES]
              mirrors.append(github_url)
              return mirrors

          def get_platform(platform):
              platforms.setdefault(platform, {})
              return platforms[platform]

          def get_abi(platform, abi):
              p = get_platform(platform)
              abis = p.setdefault("abis", {})
              return abis.setdefault(abi, {})

          # 第一遍：asset.* 行确定结构骨架（packageType/assetName/downloadUrl/mirrors）
          for key, asset_name in metadata.items():
              if not key.startswith("asset."):
                  continue
              platform, package_type, abi = split_platform_pkg(
                  key[len("asset."):]
              )
              github_url = (
                  f"https://github.com/{repository}/releases/download/"
                  f"{tag_name}/{asset_name}"
              )
              entry = get_abi(platform, abi) if abi else get_platform(platform)
              entry["packageType"] = package_type
              entry["assetName"] = asset_name
              entry["downloadUrl"] = github_url
              entry["mirrors"] = build_mirrors(github_url)

          # 第二遍：sha256/size/versionCode 行，按同样规则落到对应 entry。
          PREFIX_HANDLERS = (
              ("sha256.", "sha256", str),
              ("size.", "fileSize", int),
              ("versionCode.", "versionCode", int),
          )
          for key, value in metadata.items():
              for prefix, field, caster in PREFIX_HANDLERS:
                  if not key.startswith(prefix):
                      continue
                  platform, _pkg, abi = split_platform_pkg(
                      key[len(prefix):]
                  )
                  entry = get_abi(platform, abi) if abi else get_platform(platform)
                  entry[field] = caster(value)
                  break

          manifest = {
              "schemaVersion": 1,
              "repository": repository,
              "tagName": tag_name,
              "releasePageUrl": (
                  f"https://github.com/{repository}/releases/tag/{tag_name}"
              ),
              "versionName": version_name,
              "versionCode": version_code,
              "changelog": "",
              "platforms": platforms,
          }

          output = Path("release-files/update.json")
          output.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          body_path: release-body.md
          generate_release_notes: true
